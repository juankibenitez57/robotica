# waypoints.yaml — Posiciones semánticas conocidas en el mapa house_map.yaml
# Coordenadas en frame 'map' (metros)
#
# CÓMO OBTENER COORDENADAS REALES:
#   1. Lanza: ros2 launch tb3_bringup navigation.launch.py
#   2. En RViz usa "Publish Point" (toolbar) y haz click en el mapa
#   3. Lee las coordenadas del topic:
#        ros2 topic echo /clicked_point
#   4. Actualiza los valores x, y aquí
#
# Separación profesional:
#   aliases   → lenguaje humano/NLP
#   waypoints → representación espacial interna
#
# El NLP puede publicar target='cocina'. La FSM normaliza:
#   cocina → kitchen → coordenadas reales en map.
#
# IMPORTANTE:
#   No introduzcas coordenadas inventadas tipo (50, 30). En este mapa local
#   cualquier abs(x) o abs(y) mayor de 20 m se considera sospechoso.

metadata:
  frame_id: map
  max_abs_coordinate: 20.0

aliases:
  origen: origin
  inicio: origin
  base: origin
  cocina: kitchen
  kitchen: kitchen
  salon: living_room
  salón: living_room
  sala: living_room
  living room: living_room
  living_room: living_room
  habitacion: bedroom
  habitación: bedroom
  dormitorio: bedroom
  bedroom: bedroom
  pasillo: hallway
  hallway: hallway
  bano: bathroom
  baño: bathroom
  bathroom: bathroom
  entrada: entrance
  entrance: entrance
  comedor: dining_room
  dining room: dining_room
  dining_room: dining_room
  garaje: garage
  garage: garage

waypoints:
