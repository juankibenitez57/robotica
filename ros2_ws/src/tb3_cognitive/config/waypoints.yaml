# CÓMO OBTENER COORDENADAS REALES:
#   1. Lanza: ros2 launch tb3_bringup navigation.launch.py
#   2. En RViz usa "Publish Point" (toolbar) y haz click en el mapa
#   3. Lee las coordenadas del topic:
#        ros2 topic echo /clicked_point
#   4. Actualiza los valores x, y aquí
